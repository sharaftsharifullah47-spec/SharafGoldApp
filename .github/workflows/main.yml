name: Build Sharaf Gold APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and Fix Java Version
        run: |
          unzip -q Rr.zip
          FOLDER=$(find . -maxdepth 2 -name "settings.gradle*" -printf "%h\n" | head -n 1)
          echo "PROJECT_DIR=$FOLDER" >> $GITHUB_ENV
          sed -i 's/android {/android {\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }/' "$FOLDER/app/build.gradle"*

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SharafGold-APK
          path: "**/build/outputs/apk/debug/*.apk"
